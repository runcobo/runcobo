name: Crystal checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, codex/development-foundation, codex/request-validation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Crystal ${{ matrix.crystal }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        crystal: ["1.22.0", "1.22.3"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: runcobo_crsql_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/runcobo_crsql_test

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check out private request-validation dependency
        uses: actions/checkout@v7
        with:
          repository: shootingfly/request-validation
          ref: v0.1.0
          path: .request-validation
          ssh-key: ${{ secrets.REQUEST_VALIDATION_SSH_KEY }}
          persist-credentials: false
      - name: Check out private crsql generator
        uses: actions/checkout@v7
        with:
          repository: shootingfly/crsql
          ref: 21a76cdadc3bdeff7315de39414f956de8f23002
          path: .crsql
          ssh-key: ${{ secrets.CRSQL_SSH_KEY }}
          persist-credentials: false
      - name: Use checked-out dependency
        run: |
          printf 'dependencies:\n  request_validation:\n    path: "%s/.request-validation"\n  crsql:\n    path: "%s/.crsql"\n' "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/runcobo-shard.override.yml"
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: 1.31.1
      - name: Prepare dedicated test database
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f examples/crsql/db/schema.sql
      - name: Check project
        run: make generate-check check integration
        env:
          SHARDS_OVERRIDE: ${{ runner.temp }}/runcobo-shard.override.yml
