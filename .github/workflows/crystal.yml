name: Crystal checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, codex/development-foundation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Crystal ${{ matrix.crystal }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        crystal: ["1.22.0", "1.22.3"]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check out private request-validation dependency
        uses: actions/checkout@v7
        with:
          repository: shootingfly/request-validation
          ref: 7d98e3d8c1bd7b8134ecf0198188b686509c5130
          path: .request-validation
          ssh-key: ${{ secrets.REQUEST_VALIDATION_SSH_KEY }}
          persist-credentials: false
      - name: Use checked-out dependency
        run: |
          printf 'dependencies:\n  request_validation:\n    path: "%s/.request-validation"\n' "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/runcobo-shard.override.yml"
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}
      - name: Check project
        run: make check
        env:
          SHARDS_OVERRIDE: ${{ runner.temp }}/runcobo-shard.override.yml
